services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./public/uploads:/var/www/html/public/uploads
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=behn_abandoned_waste
      - DB_USERNAME=waste_user
      - DB_PASSWORD=waste_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - waste_network

  web:
    image: nginx:alpine
    container_name: waste_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - waste_network

  mysql:
    image: mysql:8.0
    container_name: waste_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: behn_abandoned_waste
      MYSQL_USER: waste_user
      MYSQL_PASSWORD: waste_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - waste_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - waste_network

  redis:
    image: redis:alpine
    container_name: waste_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - waste_network

networks:
  waste_network:
    driver: bridge

volumes:
  waste_db_data:
    driver: local
